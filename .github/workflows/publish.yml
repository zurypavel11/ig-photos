name: Publikace IG postu

# Spouští se automaticky v Po/St/Pá ráno (viz cron níže) a jde i spustit
# ručně tlačítkem v záložce Actions na GitHubu ("Run workflow").
on:
  schedule:
    # Časy jsou v UTC, GitHub Actions neumí přímo české časové pásmo.
    # Teď v létě je ČR na UTC+2 (CEST), proto odečteno -2h od tvých časů:
    #   úterý 7:00 ČR   -> 5:00 UTC
    #   čtvrtek 15:00 ČR -> 13:00 UTC
    #   neděle 18:45 ČR  -> 16:45 UTC
    # POZOR: až v říjnu skončí letní čas (ČR přejde na UTC+1), tyhle časy
    # se posunou o hodinu dřív (např. úterý vyjde na 8:00 ČR místo 7:00).
    # GitHub cron neumí automatické přepočítání letního času - bude
    # potřeba časy jednou za půl roku ručně o hodinu posunout.
    - cron: "0 5 * * 2"    # úterý 7:00 ČR
    - cron: "0 13 * * 4"   # čtvrtek 15:00 ČR
    - cron: "15 16 * * 0"  # neděle 18:15 ČR
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repa
        uses: actions/checkout@v4

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalace fontů (pro text overlay na fotce)
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Instalace závislostí
        run: pip install -r requirements.txt

      - name: Nastavení git identity pro automatické commity
        run: |
          git config user.name "IG Automation Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Publikace postu
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/publish_post.py
